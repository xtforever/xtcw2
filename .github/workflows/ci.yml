# XTCW2 CI/CD Pipeline

name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc \
          make \
          pkg-config \
          libx11-dev \
          libxt-dev \
          libxaw7-dev \
          libxmu-dev \
          libxft-dev \
          libfontconfig1-dev \
          libxrender-dev \
          libxpm-dev \
          libxext-dev \
          libcairo2-dev \
          liblua5.3-dev \
          lua5.3
    
    - name: Clean build
      run: make distclean
    
    - name: Build all
      run: make all
    
    - name: Build LuaRunner
      run: make luarunner
    
    - name: Build CommanderRunner
      run: cd experimental && make commander_runner
    
    - name: Build tests
      run: make tests

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libx11-dev \
          libxt-dev \
          libxaw7-dev \
          libxmu-dev \
          libxft-dev \
          libfontconfig1-dev \
          libxrender-dev \
          libxpm-dev \
          libxext-dev \
          libcairo2-dev \
          liblua5.3-dev \
          lua5.3
    
    - name: Restore build artifacts
      uses: actions/cache@v4
      with:
        path: |
          build/
          LuaRunner/luarunner
          tests/
        key: ${{ runner.os }}-build-${{ hashFiles('makefile', 'utils/**', 'wbuild_widgets/**') }}
    
    - name: Run tests with xvfb
      run: |
        # Rebuild if needed
        make tests || make tests
        
        # Run tests in headless mode
        xvfb-run -a ./tests/run_all_tests.sh
    
    - name: Upload test logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: tests/*.log

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format
    
    - name: Check code formatting
      run: |
        # Check for common formatting issues
        # This is a placeholder - actual linting would need custom rules
        echo "Code formatting check would go here"
        # find . -name '*.c' -o -name '*.h' | xargs clang-format --dry-run -Werror || true

  docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Verify documentation
      run: |
        # Check that key docs exist
        ls -la *.md
        echo "Documentation check passed"
